<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;">
  <title>Tamagotchi Desktop Pet</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-container">
    <!-- Title Bar -->
    <div class="title-bar">
      <h1>TAMAGOTCHI</h1>
    </div>

    <!-- Canvas Screen -->
    <div class="screen-container">
      <canvas id="pet-canvas" width="320" height="240"></canvas>
      <div class="scanlines"></div>
      <div class="quote-bubble" id="quote-bubble" style="display:none;">
        <span class="quote-text" id="quote-text"></span>
        <span class="quote-tail"></span>
      </div>
    </div>

    <!-- Stat Bars -->
    <div class="stats-container">
      <div class="stat-row">
        <span class="stat-label">HUNGER</span>
        <div class="stat-bar" id="stat-hunger"></div>
      </div>
      <div class="stat-row">
        <span class="stat-label">HAPPY</span>
        <div class="stat-bar" id="stat-happiness"></div>
      </div>
      <div class="stat-row">
        <span class="stat-label">ENERGY</span>
        <div class="stat-bar" id="stat-energy"></div>
      </div>
      <div class="stat-row">
        <span class="stat-label">HYGIENE</span>
        <div class="stat-bar" id="stat-hygiene"></div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="buttons-container">
      <button class="action-btn btn-feed" id="btn-feed">
        <img src="data/icons/feed.png" alt="" class="btn-icon">
        <span class="btn-label">FEED</span>
      </button>
      <button class="action-btn btn-play" id="btn-play">
        <img src="data/icons/play.png" alt="" class="btn-icon">
        <span class="btn-label">PLAY</span>
      </button>
      <button class="action-btn btn-clean" id="btn-clean">
        <img src="data/icons/clean.png" alt="" class="btn-icon">
        <span class="btn-label">CLEAN</span>
      </button>
      <button class="action-btn btn-sleep" id="btn-sleep">
        <img src="data/icons/sleep.png" alt="" class="btn-icon">
        <span class="btn-label">SLEEP</span>
      </button>
      <button class="action-btn btn-pet" id="btn-pet">
        <img src="data/icons/pet.png" alt="" class="btn-icon">
        <span class="btn-label">PET</span>
      </button>
      <button class="action-btn btn-hobbies" id="btn-hobbies">
        <span class="btn-label">HOBBIES</span>
      </button>
    </div>

    <!-- Info Footer -->
    <div class="info-footer">
      <span id="info-age">Age: 0m</span>
      <span id="info-stage">Egg</span>
      <span id="info-health">&#9829; 80</span>
      <button class="companion-toggle-btn" id="btn-companion">COMPANION</button>
    </div>

    <!-- Activity Log -->
    <div class="activity-log" id="activity-log">
      <div class="activity-log-header">ACTIVITY</div>
      <div class="activity-log-entries" id="activity-log-entries"></div>
    </div>

    <!-- Hobby Panel -->
    <div class="hobby-panel" id="hobby-panel" style="display:none;">
      <div class="hobby-panel-header">HOBBIES</div>
      <div class="hobby-panel-content" id="hobby-panel-content"></div>
    </div>

    <!-- Notifications Area -->
    <div class="notifications" id="notifications"></div>
  </div>

  <!-- Scripts loaded at bottom for performance -->
  <script src="pet-presenter.js"></script>
  <script src="quotes.js"></script>
  <script src="pet.js"></script>
  <script src="animator.js"></script>
  <script src="ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
